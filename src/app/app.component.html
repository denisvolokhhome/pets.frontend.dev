<a href="#main-content" class="skip-to-main">Skip to main content</a>
<app-top-menu></app-top-menu>
<main id="main-content" class="main-wrapper flex flex-row h-100">
  <app-left-menu *ngIf="isAuthenticated && !isPublicPage()"></app-left-menu>
  <div class="content-wrapper w-100 mx-3 mt-3" [ngClass]="{'public-page': isPublicPage()}">
    <router-outlet></router-outlet>
  </div>
</main>

<!-- PrimeNG Toast for notifications -->
<p-toast position="top-right" [life]="5000"></p-toast>

<!-- Cookie Consent Banner -->
<div class="cookie-banner" *ngIf="!cookiesAccepted" role="dialog" aria-label="Cookie consent">
  <div class="cookie-content">
    <i class="bi bi-shield-check cookie-icon"></i>
    <p>We use cookies to improve your experience. By continuing to use Breedly, you agree to our use of cookies.</p>
  </div>
  <button class="cookie-accept-btn" (click)="acceptCookies()">Got it</button>
</div>
