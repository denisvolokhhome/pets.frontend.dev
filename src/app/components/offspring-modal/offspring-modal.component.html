<div class="modal-overlay" (click)="onClose()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="modal-header">
      <h2 class="modal-title">
        <i class="bi bi-plus-circle"></i>
        Add Offspring
      </h2>
      <button class="close-button" (click)="onClose()" type="button">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="modal-body">
      <form [formGroup]="offspringForm" (ngSubmit)="onSubmit()">
        <div class="form-grid">
          <!-- Offspring Name -->
          <div class="form-group full-width">
            <label for="name" class="form-label">
              Name <span class="required">*</span>
            </label>
            <input
              type="text"
              id="name"
              class="form-input"
              formControlName="name"
              placeholder="Enter offspring name"
            />
          </div>

          <!-- Breed (Read-only) -->
          <div class="form-group">
            <label class="form-label">Breed</label>
            <input
              type="text"
              class="form-input"
              [value]="breedDisplay"
              readonly
              disabled
            />
          </div>

          <!-- Date of Birth -->
          <div class="form-group">
            <label for="date_of_birth" class="form-label">
              Date of Birth <span class="required">*</span>
            </label>
            <input
              type="date"
              id="date_of_birth"
              class="form-input"
              formControlName="date_of_birth"
            />
          </div>

          <!-- Gender Selection -->
          <div class="form-group full-width">
            <label class="form-label">
              Gender <span class="required">*</span>
            </label>
            <div class="gender-selection">
              <button
                type="button"
                class="gender-button"
                [class.selected]="selectedGender === 'Male'"
                (click)="selectGender('Male')"
              >
                <i class="bi bi-gender-male"></i>
                <span>Male</span>
              </button>
              <button
                type="button"
                class="gender-button"
                [class.selected]="selectedGender === 'Female'"
                (click)="selectGender('Female')"
              >
                <i class="bi bi-gender-female"></i>
                <span>Female</span>
              </button>
            </div>
          </div>

          <!-- Status -->
          <div class="form-group">
            <label for="status" class="form-label">Status</label>
            <select
              id="status"
              class="form-select"
              formControlName="status"
            >
              <option value="Available">Available</option>
              <option value="Reserved">Reserved</option>
              <option value="Sold">Sold</option>
            </select>
          </div>

          <!-- Price -->
          <div class="form-group">
            <label for="price" class="form-label">Price</label>
            <input
              type="number"
              id="price"
              class="form-input"
              formControlName="price"
              placeholder="e.g., 1500"
              step="0.01"
            />
          </div>

          <!-- Color/Markings -->
          <div class="form-group full-width">
            <label for="color_markings" class="form-label">Color & Markings</label>
            <input
              type="text"
              id="color_markings"
              class="form-input"
              formControlName="color_markings"
              placeholder="e.g., Black with white chest"
            />
          </div>

          <!-- Description -->
          <div class="form-group full-width">
            <label for="description" class="form-label">Description</label>
            <textarea
              id="description"
              class="form-textarea"
              formControlName="description"
              rows="3"
              placeholder="Tell us about this offspring's personality, habits, or any special notes..."
            ></textarea>
          </div>
        </div>

        <!-- Modal Footer -->
        <div class="modal-footer">
          <button
            type="button"
            class="cancel-button"
            (click)="onClose()"
            [disabled]="isSubmitting"
          >
            <i class="bi bi-x-circle"></i>
            Cancel
          </button>
          <button
            type="submit"
            class="save-button"
            [disabled]="offspringForm.invalid || isSubmitting"
          >
            <i class="bi bi-check-circle"></i>
            {{ isSubmitting ? 'Saving...' : 'Save Offspring' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
