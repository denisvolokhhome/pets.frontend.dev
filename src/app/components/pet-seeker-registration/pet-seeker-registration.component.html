<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="material-icons">pets</i>
      </div>
      <h1 class="auth-title">Find Your Perfect Pet</h1>
      <p class="auth-subtitle">Create an account to connect with breeders</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="proceedRegistration()" class="auth-form">
      <!-- Email Already Exists Error -->
      <div *ngIf="emailExistsError" class="alert alert-error">
        <i class="bi bi-exclamation-circle" aria-hidden="true"></i>
        <div>
          <strong>Account Already Exists</strong>
          <p>{{ emailExistsError }} <a routerLink="/login" class="alert-link">Sign in instead</a></p>
        </div>
      </div>

      <div class="input-field-group">
        <label for="email" class="input-label">Email Address</label>
        <input
          type="email"
          id="email"
          class="input-field"
          formControlName="email"
          placeholder="your.email@example.com"
          aria-label="Email address"
          required
        />
      </div>

      <div class="input-field-group">
        <label for="password" class="input-label">Password</label>
        <input
          type="password"
          id="password"
          class="input-field"
          formControlName="password"
          placeholder="Create a strong password"
          aria-label="Password"
          required
        />
        <div *ngIf="passwordErrors.length > 0" class="validation-errors">
          <small *ngFor="let error of passwordErrors" class="error-text">
            <i class="bi bi-x-circle" aria-hidden="true"></i> {{ error }}
          </small>
        </div>
      </div>

      <div class="input-field-group">
        <label for="name" class="input-label">Name (Optional)</label>
        <input
          type="text"
          id="name"
          class="input-field"
          formControlName="name"
          placeholder="Your name"
          aria-label="Name"
        />
      </div>

      <button type="submit" class="w-full auth-submit-btn">
        <i class="bi bi-person-plus mr-2" aria-hidden="true"></i>Create Account
      </button>

      <div class="divider">
        <span>or</span>
      </div>

      <button type="button" class="w-full google-btn" (click)="signInWithGoogle()">
        <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <div class="auth-footer">
        <p class="auth-footer-text">
          Already have an account? 
          <a routerLink="/login" class="auth-link">Sign in here</a>
        </p>
        <p class="auth-footer-text mt-2">
          Are you a breeder? 
          <a routerLink="/register" class="auth-link">Register as a breeder</a>
        </p>
      </div>
    </form>
  </div>
</div>
