<aside class="filters-sidebar">
  <div class="filters-header">
    <h3 class="filters-title">
      <i class="bi bi-funnel-fill"></i>
      Filters
    </h3>
    <button 
      *ngIf="hasActiveFilters()" 
      class="btn-clear-filters"
      (click)="onClearFilters()"
      [disabled]="isLoading"
      title="Clear all filters">
      <i class="bi bi-x-circle-fill"></i>
    </button>
  </div>

  <div class="filters-content">
    <!-- Location Filter -->
    <div class="filter-group" *ngIf="config.showLocation">
      <label class="filter-label">
        <i class="bi bi-geo-alt-fill"></i>
        Location
      </label>
      <select 
        class="filter-select"
        [(ngModel)]="filterValues.location"
        (change)="onLocationChange(filterValues.location!)"
        [disabled]="isLoading">
        <option value="">All</option>
        <option *ngFor="let location of locations" [value]="location.id || location.name">
          {{ location.name }}
        </option>
      </select>
    </div>

    <!-- Gender Filter -->
    <div class="filter-group" *ngIf="config.showGender">
      <label class="filter-label">
        <i class="bi bi-gender-ambiguous"></i>
        Gender
      </label>
      <div class="gender-buttons">
        <button 
          class="gender-btn"
          [class.active]="filterValues.gender === 'Male'"
          (click)="onGenderChange(filterValues.gender === 'Male' ? '' : 'Male')"
          [disabled]="isLoading">
          <i class="bi bi-gender-male"></i>
          Male
        </button>
        <button 
          class="gender-btn"
          [class.active]="filterValues.gender === 'Female'"
          (click)="onGenderChange(filterValues.gender === 'Female' ? '' : 'Female')"
          [disabled]="isLoading">
          <i class="bi bi-gender-female"></i>
          Female
        </button>
      </div>
    </div>

    <!-- Pet Type/Kind Filter -->
    <div class="filter-group" *ngIf="config.showPetType">
      <label class="filter-label">
        <i class="bi bi-tag-fill"></i>
        Pet Type
      </label>
      <div class="pet-type-filter-buttons">
        <button 
          *ngFor="let type of petTypes"
          class="pet-type-filter-btn"
          [class.active]="filterValues.petType === type.value"
          (click)="onPetTypeChange(type.value)"
          [title]="type.label"
          [disabled]="isLoading">
          <span class="pet-type-icon-small">{{ type.icon }}</span>
          <span class="pet-type-label-small">{{ type.label }}</span>
        </button>
      </div>
    </div>

    <!-- Status Filter -->
    <div class="filter-group" *ngIf="config.showStatus">
      <label class="filter-label">
        <i class="bi bi-flag-fill"></i>
        Status
      </label>
      <select 
        class="filter-select"
        [(ngModel)]="filterValues.status"
        (change)="onStatusChange(filterValues.status!)"
        [disabled]="isLoading">
        <option value="">All Statuses</option>
        <ng-container *ngIf="config.statusOptions && config.statusOptions.length > 0">
          <option *ngFor="let option of config.statusOptions" [value]="option.value">
            {{ option.label }}
          </option>
        </ng-container>
        <ng-container *ngIf="!config.statusOptions || config.statusOptions.length === 0">
          <option [value]="BreedingStatus.Started">Started</option>
          <option [value]="BreedingStatus.InProcess">In Process</option>
          <option [value]="BreedingStatus.Done">Done</option>
          <option [value]="BreedingStatus.Voided">Voided</option>
        </ng-container>
      </select>
    </div>

    <!-- Breed Filter -->
    <div class="filter-group" *ngIf="config.showBreed">
      <label class="filter-label">
        <i class="bi bi-award-fill"></i>
        Breed
      </label>
      <select 
        class="filter-select"
        [(ngModel)]="filterValues.breed"
        (change)="onBreedChange(filterValues.breed!)"
        [disabled]="isLoading">
        <option value="">All Breeds</option>
        <option *ngFor="let breed of breeds" [value]="breed.id">
          {{ breed.name }}
        </option>
      </select>
    </div>

    <!-- Health Records Filter -->
    <div class="filter-group" *ngIf="config.showHealthRecords">
      <label class="filter-label">
        <i class="bi bi-heart-pulse-fill"></i>
        Health Records
      </label>
      <div class="health-checkboxes">
        <label class="health-checkbox" for="filter-vaccination">
          <input 
            type="checkbox"
            id="filter-vaccination"
            [(ngModel)]="filterValues.healthFilters!.vaccination"
            (ngModelChange)="onHealthFilterChange()"
            [disabled]="isLoading">
          <span class="checkbox-label">
            <i class="bi bi-shield-fill-check"></i>
            Vaccination
          </span>
        </label>
        <label class="health-checkbox" for="filter-microchip">
          <input 
            type="checkbox"
            id="filter-microchip"
            [(ngModel)]="filterValues.healthFilters!.microchip"
            (ngModelChange)="onHealthFilterChange()"
            [disabled]="isLoading">
          <span class="checkbox-label">
            <i class="bi bi-cpu"></i>
            Microchip
          </span>
        </label>
        <label class="health-checkbox" for="filter-healthcertificate">
          <input 
            type="checkbox"
            id="filter-healthcertificate"
            [(ngModel)]="filterValues.healthFilters!.healthcertificate"
            (ngModelChange)="onHealthFilterChange()"
            [disabled]="isLoading">
          <span class="checkbox-label">
            <i class="bi bi-file-medical"></i>
            Health Cert
          </span>
        </label>
        <label class="health-checkbox" for="filter-dewormed">
          <input 
            type="checkbox"
            id="filter-dewormed"
            [(ngModel)]="filterValues.healthFilters!.dewormed"
            (ngModelChange)="onHealthFilterChange()"
            [disabled]="isLoading">
          <span class="checkbox-label">
            <i class="bi bi-capsule"></i>
            Dewormed
          </span>
        </label>
        <label class="health-checkbox" for="filter-birthcertificate">
          <input 
            type="checkbox"
            id="filter-birthcertificate"
            [(ngModel)]="filterValues.healthFilters!.birthcertificate"
            (ngModelChange)="onHealthFilterChange()"
            [disabled]="isLoading">
          <span class="checkbox-label">
            <i class="bi bi-file-earmark-text"></i>
            Birth Cert
          </span>
        </label>
      </div>
    </div>

    <!-- Sort Order Filter -->
    <div class="filter-group" *ngIf="config.showSortOrder">
      <label class="filter-label">
        <i class="bi bi-sort-down"></i>
        Sort By
      </label>
      <select 
        class="filter-select"
        [(ngModel)]="filterValues.sortOrder"
        (change)="onSortOrderChange(filterValues.sortOrder!)"
        [disabled]="isLoading">
        <option value="">Default</option>
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
      </select>
    </div>
  </div>

  <!-- Results Count -->
  <div class="results-count" *ngIf="!isLoading">
    <i class="bi bi-check-circle-fill"></i>
    <span>{{ filteredCount }} of {{ totalCount }}</span>
  </div>
</aside>
