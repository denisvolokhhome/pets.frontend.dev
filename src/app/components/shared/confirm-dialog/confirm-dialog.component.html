<ng-container *ngIf="confirmService.request$ | async as request">
  <div class="confirm-backdrop" (click)="confirmService.answer(false)"></div>
  <div class="confirm-dialog" role="alertdialog" aria-modal="true"
       aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
    <div class="confirm-dialog__icon" [class.confirm-dialog__icon--danger]="request.danger" aria-hidden="true">
      <i class="bi" [ngClass]="request.danger ? 'bi-exclamation-triangle' : 'bi-question-circle'"></i>
    </div>
    <h2 id="confirm-dialog-title" class="confirm-dialog__title">{{ request.title }}</h2>
    <p id="confirm-dialog-message" class="confirm-dialog__message">{{ request.message }}</p>
    <div class="confirm-dialog__actions">
      <button #cancelButton type="button" class="ui-btn ui-btn--secondary" (click)="confirmService.answer(false)">
        {{ request.cancelText || 'Cancel' }}
      </button>
      <button type="button" class="ui-btn" [ngClass]="request.danger ? 'ui-btn--danger-solid' : 'ui-btn--primary'"
              (click)="confirmService.answer(true)">
        {{ request.confirmText || 'Confirm' }}
      </button>
    </div>
  </div>
</ng-container>
