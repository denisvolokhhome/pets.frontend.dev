<button 
  class="notification-icon"
  (click)="navigateToMessages()"
  [attr.aria-label]="hasUnreadMessages() ? 'Messages - ' + unreadCount + ' unread' : 'Messages'"
  title="Messages">
  <!-- Bell Icon -->
  <svg 
    class="bell-icon" 
    xmlns="http://www.w3.org/2000/svg" 
    width="24" 
    height="24" 
    viewBox="0 0 24 24" 
    fill="none" 
    stroke="currentColor" 
    stroke-width="2" 
    stroke-linecap="round" 
    stroke-linejoin="round">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
  </svg>
  
  <!-- Unread Badge -->
  <span 
    *ngIf="hasUnreadMessages()" 
    class="unread-badge"
    [attr.aria-label]="unreadCount + ' unread messages'">
    {{ getDisplayCount() }}
  </span>
</button>
