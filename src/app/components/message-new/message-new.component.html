<div class="message-new-container max-w-4xl mx-auto p-4">
  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Contact Breeder</h1>
      <p class="text-gray-600 mt-1">Send a message about this offspring</p>
    </div>
    <button
      (click)="goBack()"
      class="px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
      <i class="pi pi-arrow-left mr-2"></i>
      Back
    </button>
  </div>

  <!-- Loading State (only show while loading offspring context) -->
  <div *ngIf="isLoading" class="flex items-center justify-center py-12">
    <i class="pi pi-spin pi-spinner text-4xl text-gray-400"></i>
  </div>

  <!-- Message Thread (show when not loading) -->
  <div *ngIf="!isLoading" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
    <app-message-thread
      [breederId]="breederId"
      [breederName]="breederName"
      [offspringContext]="offspringContext">
    </app-message-thread>
  </div>
</div>
