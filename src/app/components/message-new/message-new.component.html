<!-- Full height container - account for top menu, margins, and left sidebar -->
<div class="flex overflow-hidden" style="height: calc(100vh - 140px);">
  
  <!-- Left Sidebar: Threads List -->
  <div class="threads-sidebar w-72 bg-white border-r border-gray-200 flex flex-col">
    <!-- Threads Header -->
    <div class="p-3 border-b border-gray-200 flex-shrink-0">
      <h2 class="text-base font-semibold text-gray-900">Conversations</h2>
    </div>

    <!-- Loading State for Threads -->
    <div *ngIf="isLoadingThreads" class="flex-1 flex items-center justify-center">
      <i class="pi pi-spin pi-spinner text-2xl text-gray-400"></i>
    </div>

    <!-- Threads List -->
    <div *ngIf="!isLoadingThreads" class="flex-1 overflow-y-auto">
      <div *ngIf="threads.length === 0" class="p-4 text-center text-gray-500">
        <i class="pi pi-inbox text-3xl mb-2"></i>
        <p class="text-xs">No conversations yet</p>
      </div>

      <div
        *ngFor="let thread of threads"
        class="thread-item p-3 border-b border-gray-100 cursor-pointer hover:bg-gray-50 transition-colors"
        [class.active]="thread.thread_id === threadId"
        (click)="selectThread(thread)">
        <div class="flex items-start gap-2">
          <div class="flex-shrink-0">
            <div class="w-9 h-9 rounded-full bg-primary-100 flex items-center justify-center text-primary-600 font-semibold text-sm">
              {{ thread.participant_name.charAt(0).toUpperCase() }}
            </div>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-0.5">
              <h3 class="text-sm font-semibold text-gray-900 truncate">{{ thread.participant_name }}</h3>
              <span class="text-xs text-gray-500 flex-shrink-0 ml-1">{{ formatDate(thread.last_activity) }}</span>
            </div>
            <p class="text-xs text-gray-600 truncate">{{ thread.latest_message.content_preview }}</p>
            <span *ngIf="thread.unread_count > 0" class="inline-block mt-1 px-1.5 py-0.5 bg-blue-100 text-blue-800 text-xs font-medium rounded-full">
              {{ thread.unread_count }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Side: Message Thread -->
  <div class="flex-1 flex flex-col min-w-0 bg-white overflow-hidden">
    <!-- Loading State (only show while loading offspring context) -->
    <div *ngIf="isLoading" class="flex-1 flex items-center justify-center">
      <i class="pi pi-spin pi-spinner text-3xl text-gray-400"></i>
    </div>

    <!-- Empty State (no thread selected) -->
    <div *ngIf="!isLoading && !threadId && !breederId" class="flex-1 flex flex-col items-center justify-center text-gray-400">
      <i class="pi pi-comments text-5xl mb-3"></i>
      <p class="text-base">Select a conversation to view messages</p>
    </div>

    <!-- Message Thread (show when not loading and has thread/breeder) -->
    <app-message-thread
      *ngIf="!isLoading && (threadId || breederId)"
      class="flex-1 flex flex-col overflow-hidden"
      [breederId]="breederId"
      [breederName]="breederName"
      [threadId]="threadId"
      [offspringContext]="offspringContext"
      [initialMessage]="initialMessage">
    </app-message-thread>
  </div>
</div>
