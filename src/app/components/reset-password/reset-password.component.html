<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="bi bi-shield-lock" style="font-size: 36px; color: white;"></i>
      </div>
      <h1 class="auth-title">Set New Password</h1>
      <p class="auth-subtitle">Choose a strong password for your account</p>
    </div>

    <!-- Success state -->
    <div *ngIf="success" class="text-center py-4">
      <div class="mx-auto w-16 h-16 rounded-full bg-green-50 flex items-center justify-center mb-4">
        <i class="bi bi-check-circle text-3xl text-green-500"></i>
      </div>
      <p class="text-gray-700 text-sm mb-4">Your password has been reset successfully.</p>
      <a routerLink="/login" class="auth-submit-btn inline-block text-center no-underline" style="display: inline-block; padding: 0.75rem 2rem;">
        <i class="bi bi-box-arrow-in-right mr-2"></i>Sign In
      </a>
    </div>

    <!-- Form -->
    <form *ngIf="!success" [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div *ngIf="errorMsg" class="p-3 mb-2 bg-red-50 text-red-700 rounded-lg text-sm">
        {{ errorMsg }}
      </div>

      <div class="input-field-group">
        <label for="password" class="input-label">New Password</label>
        <input type="password" id="password" class="input-field" formControlName="password"
               placeholder="Minimum 8 characters" aria-label="New password" />
        <small class="text-gray-400 text-xs mt-1">Must contain at least one letter and one digit</small>
      </div>

      <div class="input-field-group">
        <label for="confirmPassword" class="input-label">Confirm Password</label>
        <input type="password" id="confirmPassword" class="input-field" formControlName="confirmPassword"
               placeholder="Re-enter your password" aria-label="Confirm password" />
      </div>

      <button type="submit" class="w-full auth-submit-btn" [disabled]="isLoading || form.invalid || !token">
        <i class="bi bi-arrow-repeat animate-spin mr-2" *ngIf="isLoading"></i>
        {{ isLoading ? 'Resetting...' : 'Reset Password' }}
      </button>

      <div class="text-center mt-4">
        <a routerLink="/login" class="auth-link text-sm">Back to Sign In</a>
      </div>
    </form>
  </div>
</div>
