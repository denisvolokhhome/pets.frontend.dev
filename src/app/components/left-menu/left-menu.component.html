
<nav aria-label="Sidebar navigation">
<div [ngClass]="isCollapsed ? 'w-[80px]' : 'w-[280px]'" class="left-menu-sidebar flex flex-col shrink-0 p-3 h-full transition-all duration-300">
  <!-- Toggle Button -->
  <button 
    (click)="toggleMenu()"
    class="mb-4 p-2 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors flex items-center justify-center"
    [title]="isCollapsed ? 'Expand menu' : 'Collapse menu'"
    [attr.aria-expanded]="!isCollapsed"
    aria-label="Toggle sidebar navigation">
    <i [ngClass]="isCollapsed ? 'bi-chevron-right' : 'bi-chevron-left'" class="bi text-xl"></i>
  </button>

  <ul class="flex flex-col mb-auto">
    <li class="mb-2">
      <a 
        [routerLink]="['/dashboard']"
        routerLinkActive="bg-primary text-white"
        #rlaDashboard="routerLinkActive"
        [routerLinkActiveOptions]="{exact: true}"
        [attr.aria-current]="rlaDashboard.isActive ? 'page' : null"
        class="w-full px-4 py-2 rounded-lg font-medium transition shadow-md flex items-center gap-2 border-2 border-primary text-primary hover:bg-primary hover:text-white cursor-pointer"
        [title]="isCollapsed ? 'Dashboard' : ''">
        <i class="bi bi-speedometer2 text-xl"></i>
        <span *ngIf="!isCollapsed">Dashboard</span>
      </a>
    </li>
    
    <!-- Service provider-only menu items -->
    <li class="mb-2" *ngIf="isServiceProvider">
      <a 
        [routerLink]="['/services']"
        routerLinkActive="bg-primary text-white"
        #rlaServices="routerLinkActive"
        [routerLinkActiveOptions]="{exact: true}"
        [attr.aria-current]="rlaServices.isActive ? 'page' : null"
        class="w-full px-4 py-2 rounded-lg font-medium transition shadow-md flex items-center gap-2 border-2 border-primary text-primary hover:bg-primary hover:text-white cursor-pointer"
        [title]="isCollapsed ? 'Services' : ''">
        <i class="bi bi-briefcase text-xl"></i>
        <span *ngIf="!isCollapsed">Services</span>
      </a>
    </li>

    <!-- Breeder-only menu items -->
    <li class="mb-2" *ngIf="isBreeder">
      <a 
        [routerLink]="['/pets']"
        routerLinkActive="bg-primary text-white"
        #rlaPets="routerLinkActive"
        [routerLinkActiveOptions]="{exact: true}"
        [attr.aria-current]="rlaPets.isActive ? 'page' : null"
        class="w-full px-4 py-2 rounded-lg font-medium transition shadow-md flex items-center gap-2 border-2 border-primary text-primary hover:bg-primary hover:text-white cursor-pointer"
        [title]="isCollapsed ? 'Pets' : ''">
        <i class="bi bi-card-list text-xl"></i>
        <span *ngIf="!isCollapsed">Pets</span>
      </a>
    </li>
    <li class="mb-2" *ngIf="isBreeder">
      <a 
        [routerLink]="['/breedings']"
        routerLinkActive="bg-primary text-white"
        #rlaBreedings="routerLinkActive"
        [routerLinkActiveOptions]="{exact: true}"
        [attr.aria-current]="rlaBreedings.isActive ? 'page' : null"
        class="w-full px-4 py-2 rounded-lg font-medium transition shadow-md flex items-center gap-2 border-2 border-primary text-primary hover:bg-primary hover:text-white cursor-pointer"
        [title]="isCollapsed ? 'Breedings' : ''">
        <i class="bi bi-water text-xl"></i>
        <span *ngIf="!isCollapsed">Breedings</span>
      </a>
    </li>
    <li class="mb-2" *ngIf="isBreeder">
      <a 
        [routerLink]="['/offsprings']"
        routerLinkActive="bg-primary text-white"
        #rlaOffsprings="routerLinkActive"
        [routerLinkActiveOptions]="{exact: true}"
        [attr.aria-current]="rlaOffsprings.isActive ? 'page' : null"
        class="w-full px-4 py-2 rounded-lg font-medium transition shadow-md flex items-center gap-2 border-2 border-primary text-primary hover:bg-primary hover:text-white cursor-pointer"
        [title]="isCollapsed ? 'Offsprings' : ''">
        <i class="bi bi-grid-3x3 text-xl"></i>
        <span *ngIf="!isCollapsed">Offsprings</span>
      </a>
    </li>
    <li class="mb-2" *ngIf="isBreeder">
      <a 
        [routerLink]="['/genealogy']"
        routerLinkActive="bg-primary text-white"
        #rlaGenealogy="routerLinkActive"
        [routerLinkActiveOptions]="{exact: true}"
        [attr.aria-current]="rlaGenealogy.isActive ? 'page' : null"
        class="w-full px-4 py-2 rounded-lg font-medium transition shadow-md flex items-center gap-2 border-2 border-primary text-primary hover:bg-primary hover:text-white cursor-pointer"
        [title]="isCollapsed ? 'Genealogy' : ''">
        <i class="bi bi-diagram-3 text-xl"></i>
        <span *ngIf="!isCollapsed">Genealogy</span>
      </a>
    </li>
    
    <!-- Messages - available for all authenticated users -->
    <li class="mb-2" *ngIf="isAuthenticated">
      <a 
        [routerLink]="['/messages']"
        routerLinkActive="bg-primary text-white"
        #rlaMessages="routerLinkActive"
        [routerLinkActiveOptions]="{exact: true}"
        [attr.aria-current]="rlaMessages.isActive ? 'page' : null"
        class="w-full px-4 py-2 rounded-lg font-medium transition shadow-md flex items-center gap-2 border-2 border-primary text-primary hover:bg-primary hover:text-white cursor-pointer"
        [title]="isCollapsed ? 'Messages' : ''">
        <i class="bi bi-envelope text-xl"></i>
        <span *ngIf="!isCollapsed">Messages</span>
      </a>
    </li>
    
    <!-- Pet seeker-only menu items -->
    <li class="mb-2" *ngIf="isPetSeeker">
      <a 
        [routerLink]="['/favorites/offsprings']"
        routerLinkActive="bg-primary text-white"
        #rlaFavorites="routerLinkActive"
        [routerLinkActiveOptions]="{exact: true}"
        [attr.aria-current]="rlaFavorites.isActive ? 'page' : null"
        class="w-full px-4 py-2 rounded-lg font-medium transition shadow-md flex items-center gap-2 border-2 border-primary text-primary hover:bg-primary hover:text-white cursor-pointer"
        [title]="isCollapsed ? 'Favorites' : ''">
        <i class="bi bi-heart text-xl"></i>
        <span *ngIf="!isCollapsed">Favorites</span>
      </a>
    </li>
  </ul>
</div>
</nav>

<!-- Mobile Bottom Tab Bar -->
<nav class="mobile-bottom-nav" aria-label="Mobile navigation">
  <a [routerLink]="['/dashboard']" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="mobile-nav-item" aria-label="Dashboard">
    <i class="bi bi-speedometer2"></i>
    <span>Home</span>
  </a>
  <!-- Service provider tabs: Home · Services · Messages · Settings -->
  <ng-container *ngIf="isServiceProvider">
    <a [routerLink]="['/services']" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="mobile-nav-item" aria-label="Services">
      <i class="bi bi-briefcase"></i>
      <span>Services</span>
    </a>
  </ng-container>
  <!-- Breeder tabs -->
  <ng-container *ngIf="isBreeder">
    <a [routerLink]="['/pets']" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="mobile-nav-item" aria-label="Pets">
      <i class="bi bi-card-list"></i>
      <span>Pets</span>
    </a>
    <a [routerLink]="['/breedings']" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="mobile-nav-item" aria-label="Breedings">
      <i class="bi bi-water"></i>
      <span>Breedings</span>
    </a>
    <a [routerLink]="['/offsprings']" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="mobile-nav-item" aria-label="Offsprings">
      <i class="bi bi-grid-3x3"></i>
      <span>Offsprings</span>
    </a>
  </ng-container>
  <!-- Pet seeker tabs -->
  <ng-container *ngIf="isPetSeeker">
    <a [routerLink]="['/search-pets']" routerLinkActive="active" class="mobile-nav-item" aria-label="Search">
      <i class="bi bi-search"></i>
      <span>Search</span>
    </a>
    <a [routerLink]="['/favorites/offsprings']" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="mobile-nav-item" aria-label="Favorites">
      <i class="bi bi-heart"></i>
      <span>Favorites</span>
    </a>
  </ng-container>
  <a [routerLink]="['/messages']" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="mobile-nav-item" aria-label="Messages">
    <i class="bi bi-envelope"></i>
    <span>Messages</span>
  </a>
  <a [routerLink]="['/settings']" routerLinkActive="active" class="mobile-nav-item" aria-label="Settings">
    <i class="bi bi-gear"></i>
    <span>Settings</span>
  </a>
</nav>
