<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="material-icons">mail</i>
      </div>
      <h1 class="auth-title">Create Your Account</h1>
      <p class="auth-subtitle">Complete your registration to view breeder replies</p>
    </div>

    <div class="info-box">
      <i class="bi bi-info-circle" aria-hidden="true"></i>
      <p>You need an account to receive and view replies from breeders. Your previous messages will be linked to this account.</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="proceedRegistration()" class="auth-form">
      <div class="input-field-group">
        <label for="email" class="input-label">Email Address</label>
        <input
          type="email"
          id="email"
          class="input-field input-field-disabled"
          formControlName="email"
          aria-label="Email address"
          readonly
        />
        <small class="field-hint">This email was used to send your message</small>
      </div>

      <div class="input-field-group">
        <label for="password" class="input-label">Password</label>
        <input
          type="password"
          id="password"
          class="input-field"
          formControlName="password"
          placeholder="Create a strong password"
          aria-label="Password"
          required
        />
      </div>

      <div class="input-field-group">
        <label for="name" class="input-label">Name (Optional)</label>
        <input
          type="text"
          id="name"
          class="input-field"
          formControlName="name"
          placeholder="Your name"
          aria-label="Name"
        />
      </div>

      <button type="submit" class="w-full auth-submit-btn">
        <i class="bi bi-check-circle mr-2" aria-hidden="true"></i>Complete Registration
      </button>

      <div class="auth-footer">
        <p class="auth-footer-text">
          Already have an account? 
          <a routerLink="/login" class="auth-link">Sign in here</a>
        </p>
      </div>
    </form>
  </div>
</div>
