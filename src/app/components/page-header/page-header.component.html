<header class="page-header">
  <!-- Left: Title -->
  <div class="header-left">
    <h1 class="page-title">
      <i [class]="config.icon" [style.color]="config.iconColor || '#ec4899'"></i>
      {{ config.title }}
    </h1>
  </div>

  <!-- Center: Search -->
  <div class="header-center">
    <div class="search-container" *ngIf="config.showSearch">
      <input
        type="text"
        class="search-input"
        [placeholder]="config.searchPlaceholder || 'Search...'"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchChange($event)"
        [attr.aria-label]="config.searchPlaceholder || 'Search'"
      />
      <i class="bi bi-search search-icon"></i>
      <button
        *ngIf="searchTerm"
        (click)="clearSearch()"
        class="clear-button"
        type="button"
        title="Clear search"
        aria-label="Clear search">
        <i class="bi bi-x-circle-fill"></i>
      </button>
    </div>
  </div>

  <!-- Right: Layout Switcher + projected content -->
  <div class="header-right">
    <div class="layout-switcher" *ngIf="config.showLayoutSwitcher">
      <button
        class="layout-btn"
        [class.active]="currentLayout === 'table'"
        (click)="onLayoutChange('table')"
        title="Table View"
        type="button"
        aria-label="Table view"
        [attr.aria-pressed]="currentLayout === 'table'">
        <i class="bi bi-table"></i>
      </button>
      <button
        class="layout-btn"
        [class.active]="currentLayout === 'cards'"
        (click)="onLayoutChange('cards')"
        title="Card View"
        type="button"
        aria-label="Card view"
        [attr.aria-pressed]="currentLayout === 'cards'">
        <i class="bi bi-postcard-heart"></i>
      </button>
    </div>
    <ng-content></ng-content>
  </div>
</header>
