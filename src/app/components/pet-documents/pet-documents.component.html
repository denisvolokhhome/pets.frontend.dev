<div class="p-5">
  <h3 class="text-lg font-semibold text-gray-800 mb-4">
    <i class="bi bi-file-earmark-text text-blue-500 mr-2"></i>
    Documents{{ petName ? ' — ' + petName : '' }}
  </h3>

  <!-- Upload area -->
  <label
    class="flex items-center justify-center gap-2 px-4 py-3 mb-4 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-colors"
    [class.opacity-50]="isUploading"
    [class.pointer-events-none]="isUploading">
    <i class="bi text-lg" [ngClass]="isUploading ? 'bi-arrow-repeat animate-spin' : 'bi-cloud-arrow-up text-blue-500'"></i>
    <span class="text-sm text-gray-600">{{ isUploading ? 'Uploading...' : 'Upload PDF or Image (max 10MB)' }}</span>
    <input type="file" class="hidden" accept=".pdf,.jpg,.jpeg,.png,.gif,.webp" (change)="onFileSelect($event)" [disabled]="isUploading" />
  </label>

  <!-- Loading -->
  <div *ngIf="isLoading" class="flex justify-center py-8">
    <i class="bi bi-arrow-repeat animate-spin text-2xl text-gray-400"></i>
  </div>

  <!-- Empty state -->
  <div *ngIf="!isLoading && documents.length === 0" class="text-center py-8 text-gray-400">
    <i class="bi bi-folder2-open text-4xl mb-2 block"></i>
    <p class="text-sm">No documents yet</p>
  </div>

  <!-- Document list -->
  <div *ngIf="!isLoading && documents.length > 0" class="space-y-2">
    <div *ngFor="let doc of documents"
         class="flex items-center gap-3 px-3 py-2.5 bg-gray-50 rounded-lg border border-gray-200 hover:bg-gray-100 transition-colors group">
      
      <!-- Icon -->
      <div class="flex-shrink-0 w-9 h-9 rounded-lg flex items-center justify-center"
           [ngClass]="isPdf(doc) ? 'bg-red-100' : 'bg-blue-100'">
        <i class="bi text-lg" [ngClass]="isPdf(doc) ? 'bi-file-earmark-pdf text-red-600' : 'bi-file-earmark-image text-blue-600'"></i>
      </div>

      <!-- Info -->
      <div class="flex-1 min-w-0">
        <a [href]="getDocUrl(doc)" target="_blank" rel="noopener noreferrer"
           class="text-sm font-medium text-gray-800 hover:text-blue-600 truncate block no-underline">
          {{ doc.file_name }}
        </a>
        <span class="text-xs text-gray-400">{{ formatSize(doc.file_size) }}</span>
      </div>

      <!-- Actions -->
      <div class="flex-shrink-0 flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
        <a [href]="getDocUrl(doc)" target="_blank" rel="noopener noreferrer"
           class="w-8 h-8 rounded-full flex items-center justify-center text-gray-500 hover:bg-blue-100 hover:text-blue-600 transition-colors"
           title="Open"
           aria-label="Open document">
          <i class="bi bi-box-arrow-up-right text-sm"></i>
        </a>
        <button
          (click)="deleteDocument(doc)"
          class="w-8 h-8 rounded-full flex items-center justify-center text-gray-500 hover:bg-red-100 hover:text-red-600 transition-colors border-0 bg-transparent cursor-pointer"
          title="Delete"
          aria-label="Delete document">
          <i class="bi bi-trash3 text-sm"></i>
        </button>
      </div>
    </div>
  </div>

  <p class="text-xs text-gray-400 mt-3">{{ documents.length }}/10 documents</p>
</div>
