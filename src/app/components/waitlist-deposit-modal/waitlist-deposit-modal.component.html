<div class="modal-overlay" (click)="onClose()">
  <div class="wl-modal" role="dialog" aria-modal="true" aria-label="Record deposit" (click)="$event.stopPropagation()">
    <div class="wl-modal-header">
      <h3>Deposit · {{ entry.display_name }}</h3>
      <button type="button" class="ui-icon-btn" (click)="onClose()" aria-label="Close"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="wl-modal-body">
      <div class="field-group">
        <label class="field-label" for="dep-status">Status</label>
        <select id="dep-status" class="field-select" [(ngModel)]="status">
          <option *ngFor="let s of statuses" [value]="s">{{ labels[s] }}</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label" for="dep-amount">Amount ($)</label>
        <input id="dep-amount" type="number" min="0" step="0.01" class="field-input" [class.field-error]="errors['amount']" [(ngModel)]="amount" />
        <span class="error-msg" *ngIf="errors['amount']">{{ errors['amount'] }}</span>
      </div>
      <div class="field-group">
        <label class="field-label" for="dep-date">Received on<span *ngIf="status === 'received'"> *</span></label>
        <input id="dep-date" type="date" class="field-input" [class.field-error]="errors['receivedOn']" [(ngModel)]="receivedOn" />
        <span class="error-msg" *ngIf="errors['receivedOn']">{{ errors['receivedOn'] }}</span>
      </div>
      <div class="field-group">
        <label class="field-label" for="dep-method">Method</label>
        <input id="dep-method" type="text" class="field-input" [(ngModel)]="method" placeholder="Zelle, check, cash…" />
      </div>
    </div>
    <div class="wl-modal-footer">
      <button type="button" class="ui-btn ui-btn--secondary" (click)="onClose()">Cancel</button>
      <button type="button" class="ui-btn ui-btn--primary" data-testid="save" (click)="save()" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </div>
</div>
