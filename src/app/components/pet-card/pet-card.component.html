<div class="pet-card group">
  <!-- Photo -->
  <div class="pet-card__media">
    <div
      *ngIf="pet.image_path || pet.image_url; else noPhoto"
      class="pet-card__photo"
      [style.background-image]="'url(' + getPetImageUrl() + ')'"
      role="img"
      [attr.aria-label]="pet.name + ' photo'"
    ></div>
    <ng-template #noPhoto>
      <div class="pet-card__photo pet-card__photo--empty">
        <i class="bi bi-image" aria-hidden="true"></i>
      </div>
    </ng-template>

    <span *ngIf="pet.is_puppy === 1" class="ui-badge ui-badge--warning pet-card__flag" title="Young animal">
      <i class="bi bi-heart-fill" aria-hidden="true"></i> Young
    </span>

    <!-- Actions: same set and order as the table view -->
    <div class="pet-card__actions">
      <button type="button" class="ui-icon-btn" (click)="editPet($event)" title="Edit" aria-label="Edit pet">
        <i class="bi bi-pencil"></i>
      </button>
      <button type="button" class="ui-icon-btn" (click)="openQuickBreeding($event)" title="Quick breeding" aria-label="Quick breeding">
        <i class="bi bi-hearts"></i>
      </button>
      <button type="button" class="ui-icon-btn" (click)="onOpenDocuments($event)" title="Documents" aria-label="Documents">
        <i class="bi bi-file-earmark-text"></i>
      </button>
      <button type="button" class="ui-icon-btn ui-icon-btn--danger" (click)="deletePet($event)" title="Remove" aria-label="Remove pet">
        <i class="bi bi-trash"></i>
      </button>
    </div>
  </div>

  <!-- Details -->
  <div class="pet-card__body">
    <div class="pet-card__title-row">
      <h4 class="pet-card__name" [title]="pet.name">{{ pet.name }}</h4>
      <i
        class="bi pet-card__gender"
        [ngClass]="pet.gender === 'Male' ? 'bi-gender-male text-blue-500' : 'bi-gender-female text-pink-500'"
        [attr.aria-label]="pet.gender"
        [title]="pet.gender"
      ></i>
    </div>
    <p class="pet-card__meta">{{ breedName || 'Breed not set' }}</p>
    <p *ngIf="pet.date_of_birth" class="pet-card__meta">
      <time [attr.datetime]="pet.date_of_birth">{{ formatDate(pet.date_of_birth) }}</time>
      <span class="ui-muted"> · {{ getAge(pet.date_of_birth) }}</span>
    </p>
    <p *ngIf="pet.location_name" class="pet-card__meta pet-card__location" [title]="pet.location_name">
      <i class="bi bi-geo-alt" aria-hidden="true"></i>
      <span>{{ pet.location_name }}</span>
    </p>

    <p *ngIf="pet.description" class="pet-card__description">{{ pet.description }}</p>

    <div *ngIf="hasHealthRecords()" class="pet-card__health">
      <span *ngIf="pet.has_vaccination" class="ui-badge ui-badge--success" title="Vaccinated"><i class="bi bi-shield-fill-check"></i> Vacc</span>
      <span *ngIf="pet.has_microchip" class="ui-badge ui-badge--success" title="Microchipped"><i class="bi bi-cpu"></i> Chip</span>
      <span *ngIf="pet.has_healthcertificate" class="ui-badge ui-badge--success" title="Health Certificate"><i class="bi bi-file-medical"></i> Health</span>
      <span *ngIf="pet.has_dewormed" class="ui-badge ui-badge--success" title="Dewormed"><i class="bi bi-capsule"></i> Deworm</span>
      <span *ngIf="pet.has_birthcertificate" class="ui-badge ui-badge--success" title="Birth Certificate"><i class="bi bi-file-earmark-text"></i> Birth</span>
    </div>
  </div>
</div>
