<div class="settings-container">
  <div class="settings-sidebar">
    <h2>Settings</h2>
    <nav class="sidebar-nav">
      <button 
        class="sidebar-nav-item" 
        [class.active]="isActive('general')"
        (click)="navigateToSection('general')">
        General
      </button>
      <button 
        *ngIf="isBreeder"
        class="sidebar-nav-item" 
        [class.active]="isActive('breedery')"
        (click)="navigateToSection('breedery')">
        Breedery Information
      </button>
      <button 
        *ngIf="isBreeder || isServiceProvider"
        class="sidebar-nav-item" 
        [class.active]="isActive('locations')"
        (click)="navigateToSection('locations')">
        {{ isServiceProvider ? 'Service Locations' : 'Breeding Locations' }}
      </button>
      <button 
        *ngIf="isServiceProvider"
        class="sidebar-nav-item" 
        [class.active]="isActive('service-categories')"
        (click)="navigateToSection('service-categories')">
        My Service Categories
      </button>
      <button 
        *ngIf="isBreeder"
        class="sidebar-nav-item" 
        [class.active]="isActive('subscription')"
        (click)="navigateToSection('subscription')">
        Subscription
      </button>
      <!-- Notifications settings temporarily disabled
      <button 
        *ngIf="isBreeder"
        class="sidebar-nav-item" 
        [class.active]="isActive('notifications')"
        (click)="navigateToSection('notifications')">
        Notifications
      </button>
      -->
      <button 
        class="sidebar-nav-item" 
        [class.active]="isActive('support')"
        (click)="navigateToSection('support')">
        Help &amp; Support
      </button>
    </nav>
  </div>
  
  <div class="settings-content">
    <router-outlet></router-outlet>
  </div>
</div>
