<div class="modal-backdrop" *ngIf="visible" (click)="closeModal()">
  <div class="auth-card" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="closeModal()"><i class="bi bi-x-lg"></i></button>

    <!-- Header -->
    <div class="auth-header">
      <div class="auth-logo"><i class="bi bi-shield-lock-fill"></i></div>
      <h2 class="auth-title">Sign In Required</h2>
      <p class="auth-subtitle">Sign in or create an account to continue</p>
    </div>

    <!-- Login Form -->
    <form *ngIf="!showRegisterForm" [formGroup]="loginForm" (ngSubmit)="onLogin()" class="auth-form">
      <div class="input-field-group">
        <label class="input-label">Email Address</label>
        <input type="email" formControlName="email" placeholder="your.email@example.com" class="input-field" />
      </div>
      <div class="input-field-group">
        <label class="input-label">Password</label>
        <input type="password" formControlName="password" placeholder="Enter your password" class="input-field" />
      </div>
      <button type="submit" class="auth-submit-btn" [disabled]="loginForm.invalid || isLoggingIn">
        <i [class]="isLoggingIn ? 'bi bi-arrow-repeat spin' : 'bi bi-box-arrow-in-right'"></i>
        {{ isLoggingIn ? 'Signing in...' : 'Sign In' }}
      </button>
      <div class="auth-footer">
        <p class="auth-footer-text">Don't have an account? <a class="auth-link" (click)="closeModal(); router.navigate(['/register/pet-seeker'])">Register here</a></p>
      </div>
    </form>

    <!-- Register Form -->
    <form *ngIf="showRegisterForm" [formGroup]="registerForm" (ngSubmit)="onRegister()" class="auth-form">
      <div class="name-row">
        <div class="input-field-group">
          <label class="input-label">First Name</label>
          <input type="text" formControlName="firstName" placeholder="First name" class="input-field" />
        </div>
        <div class="input-field-group">
          <label class="input-label">Last Name</label>
          <input type="text" formControlName="lastName" placeholder="Last name" class="input-field" />
        </div>
      </div>
      <div class="input-field-group">
        <label class="input-label">Email Address</label>
        <input type="email" formControlName="email" placeholder="your.email@example.com" class="input-field" />
      </div>
      <div class="input-field-group">
        <label class="input-label">Password</label>
        <input type="password" formControlName="password" placeholder="Create a password" class="input-field" />
      </div>
      <div class="input-field-group">
        <label class="input-label">Confirm Password</label>
        <input type="password" formControlName="confirmPassword" placeholder="Confirm password" class="input-field" />
        <small class="error-text" *ngIf="registerForm.errors?.['passwordMismatch'] && registerConfirmPassword?.touched">
          Passwords do not match
        </small>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" formControlName="acceptTerms" id="modal-terms" />
        <label for="modal-terms" class="checkbox-label">
          I accept the <a href="/terms" target="_blank" class="auth-link">Terms</a> and <a href="/privacy" target="_blank" class="auth-link">Privacy Policy</a>
        </label>
      </div>
      <button type="submit" class="auth-submit-btn" [disabled]="registerForm.invalid || isRegistering">
        <i [class]="isRegistering ? 'bi bi-arrow-repeat spin' : 'bi bi-person-plus'"></i>
        {{ isRegistering ? 'Creating...' : 'Create Account' }}
      </button>
      <div class="auth-footer">
        <p class="auth-footer-text">Already have an account? <a class="auth-link" (click)="switchToLogin()">Sign in here</a></p>
      </div>
    </form>
  </div>
</div>
