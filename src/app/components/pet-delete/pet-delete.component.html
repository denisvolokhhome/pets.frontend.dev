<form
  #deletePet="ngForm"
  enctype="multipart/form-data"
  [formGroup]="form"
  (ngSubmit)="submit()"
>
  <div class="px-6 py-6 text-center">
    <div class="mx-auto w-14 h-14 rounded-full bg-amber-50 flex items-center justify-center mb-4">
      <i class="bi bi-heart-half text-2xl text-amber-400"></i>
    </div>
    <h2 class="text-lg font-semibold text-gray-900 mb-2">Remove this pet from your profile?</h2>
    <p class="text-sm text-gray-500">This will remove the pet and its associated data. This action cannot be undone.</p>
    <input
      type="text"
      class="pet_id hidden"
      formControlName="petId"
      [value]="pet_id"
    />
  </div>
  <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
    <button type="button" class="ui-btn ui-btn--secondary" (click)="modalClose()">
      Cancel
    </button>
    <button type="submit" class="ui-btn ui-btn--danger-solid">
      Remove
    </button>
  </div>
</form>
