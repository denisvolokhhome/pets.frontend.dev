<div 
  class="breeder-card" 
  [class.highlighted]="isHighlighted"
  (click)="onCardClick()"
  (mouseenter)="onCardHover()">
  
  <!-- Thumbnail -->
  <div class="breeder-card__image">
    <img *ngIf="breeder.thumbnail_url"
      [src]="getImageUrl(breeder.thumbnail_url)" 
      [alt]="breeder.breeder_name"
      class="breeder-card__thumbnail"
      loading="lazy"
      decoding="async">
    <div *ngIf="!breeder.thumbnail_url" class="breeder-card__placeholder">
      <i class="bi bi-person-circle"></i>
    </div>
  </div>

  <!-- Content -->
  <div class="breeder-card__content">
    <div class="breeder-card__top">
      <h3 class="breeder-card__name">{{ breeder.breeder_name }}</h3>
      <span class="breeder-card__distance-badge">~{{ breeder.distance.toFixed(1) }} mi</span>
    </div>

    <p class="breeder-card__breeds">{{ getBreedNames() }}</p>

    <div class="breeder-card__meta">
      <span class="breeder-card__approx">
        <i class="bi bi-geo-alt"></i> Approximate location
      </span>
      <div class="breeder-card__rating" *ngIf="breeder.rating">
        <i class="bi bi-star-fill"></i> {{ breeder.rating.toFixed(1) }}
      </div>
    </div>

    <!-- Inline action links -->
    <div class="breeder-card__actions">
      <button class="breeder-card__link breeder-card__link--primary" (click)="onViewProfile($event)">Profile</button>
      <span class="breeder-card__divider">·</span>
      <button class="breeder-card__link" (click)="onViewOffsprings($event)">Offsprings</button>
      <span class="breeder-card__divider">·</span>
      <button class="breeder-card__link" (click)="onContactBreeder($event)">Contact</button>
    </div>
  </div>
</div>

<!-- Contact Breeder Modal -->
<app-contact-breeder
  [breederId]="breeder.user_id"
  [breederName]="breeder.breeder_name"
  [(visible)]="showContactModal"
  (messageSent)="onMessageSent()">
</app-contact-breeder>
