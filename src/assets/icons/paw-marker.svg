<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Shadow -->
  <ellipse cx="16" cy="30" rx="8" ry="2" fill="rgba(0,0,0,0.2)"/>
  
  <!-- Main paw print in blue -->
  <g transform="translate(16, 16)">
    <!-- Center pad -->
    <ellipse cx="0" cy="2" rx="5" ry="6" fill="#3388ff"/>
    
    <!-- Top left toe -->
    <ellipse cx="-5" cy="-4" rx="3" ry="4" fill="#3388ff" transform="rotate(-20 -5 -4)"/>
    
    <!-- Top center toe -->
    <ellipse cx="0" cy="-6" rx="3" ry="4" fill="#3388ff"/>
    
    <!-- Top right toe -->
    <ellipse cx="5" cy="-4" rx="3" ry="4" fill="#3388ff" transform="rotate(20 5 -4)"/>
    
    <!-- Bottom toe -->
    <ellipse cx="0" cy="8" rx="3" ry="3.5" fill="#3388ff"/>
  </g>
  
  <!-- White outline for visibility -->
  <g transform="translate(16, 16)" fill="none" stroke="white" stroke-width="1">
    <ellipse cx="0" cy="2" rx="5" ry="6"/>
    <ellipse cx="-5" cy="-4" rx="3" ry="4" transform="rotate(-20 -5 -4)"/>
    <ellipse cx="0" cy="-6" rx="3" ry="4"/>
    <ellipse cx="5" cy="-4" rx="3" ry="4" transform="rotate(20 5 -4)"/>
    <ellipse cx="0" cy="8" rx="3" ry="3.5"/>
  </g>
</svg>
