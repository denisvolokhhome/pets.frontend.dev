version: '3.8'

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: breedly-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - breedly-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: breedly-postgres
    environment:
      POSTGRES_DB: breedly_db
      POSTGRES_USER: breedly_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-breedly_password_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - breedly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breedly_user -d breedly_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend
  backend:
    image: ${REGISTRY_URL:-192.168.68.110:80}/${REGISTRY_PROJECT:-breedly}/${BACKEND_IMAGE_NAME:-breedly-backend}:latest
    container_name: breedly-backend
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://breedly_user:${POSTGRES_PASSWORD:-breedly_password_change_me}@postgres:5432/breedly_db
      
      # Redis Cache
      REDIS_URL: redis://redis:6379/0
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-min-32-chars-change-in-production}
      
      # File Storage
      STORAGE_PATH: storage/app
      STORAGE_URL: http://dev.breedly.us/storage
      
      # OAuth (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      
      # Frontend URL
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      
      # Environment
      DEBUG: ${DEBUG:-false}
      TESTING: false
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - breedly-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Angular Frontend
  frontend:
    image: ${REGISTRY_URL:-192.168.68.110:80}/${REGISTRY_PROJECT:-breedly}/${FRONTEND_IMAGE_NAME:-breedly-frontend}:latest
    container_name: breedly-frontend
    depends_on:
      - backend
    networks:
      - breedly-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: breedly-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - breedly-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_storage:
    driver: local
  nginx_logs:
    driver: local

networks:
  breedly-network:
    driver: bridge
