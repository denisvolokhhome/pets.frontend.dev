# Included in the server block AND in every location that has its own add_header:
# nginx drops inherited add_header directives in any block that defines one.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# geolocation: search page "near me"; nothing uses camera/microphone/payment APIs
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
